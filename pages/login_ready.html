<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | شجرة عفرين</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f6f3;
      color: #1f2937;
    }

    header {
      background: #174d2a;
      color: white;
      padding: 18px 20px;
    }

    .header-container {
      max-width: 1050px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
    }

    .home-link {
      color: white;
      text-decoration: none;
    }

    main {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 18px;
      padding: 32px 25px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.11);
    }

    .login-card h1 {
      margin: 0 0 10px;
      text-align: center;
      color: #174d2a;
    }

    .intro {
      margin: 0 0 28px;
      text-align: center;
      color: #6b7280;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #174d2a;
      box-shadow: 0 0 0 3px rgba(23, 77, 42, 0.12);
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #174d2a;
      color: white;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #226739;
    }

    .links {
      margin-top: 22px;
      text-align: center;
    }

    .links a {
      display: block;
      margin-top: 12px;
      color: #174d2a;
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      margin-top: 25px;
      padding: 15px;
      border-right: 5px solid #d4a72c;
      background: #fff9e8;
      border-radius: 10px;
      color: #5f5128;
      line-height: 1.7;
    }


    .message {
      display:none;
      margin-top:20px;
      padding:14px;
      border-radius:10px;
      line-height:1.7;
    }
    .message.error{display:block;background:#fee2e2;color:#991b1b;border-right:5px solid #dc2626;}
    .message.success{display:block;background:#dcfce7;color:#166534;border-right:5px solid #16a34a;}

    footer {
      background: #123c21;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-container">
      <a class="logo" href="../index.html">
        🌳 شجرة عفرين
      </a>

      <a class="home-link" href="../index.html">
        العودة إلى الرئيسية
      </a>
    </div>
  </header>

  <main>

    <section class="login-card">

      <h1>تسجيل الدخول</h1>

      <p class="intro">
        سجل الدخول لإضافة الأشخاص والصور التاريخية
        وإرسال طلبات التصحيح والمراجعة.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="login-button" type="submit">
          تسجيل الدخول
        </button>

      </form>


      <div id="formMessage" class="message"></div>
      <div class="links">
        <a href="register.html">إنشاء حساب جديد</a>
        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>
</section>

  </main>

  <footer>
    شجرة عفرين — أرشيف عائلي وتاريخي رقمي
  </footer>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    const loginForm=document.getElementById("loginForm");
    const formMessage=document.getElementById("formMessage");
    const loginButton=document.querySelector(".login-button");

    loginForm.addEventListener("submit",async(e)=>{
      e.preventDefault();

      loginButton.disabled=true;
      loginButton.textContent="جارٍ تسجيل الدخول...";

      const email=document.getElementById("email").value.trim();
      const password=document.getElementById("password").value;

      try{
        const {error}=await supabaseClient.auth.signInWithPassword({email,password});
        if(error) throw error;
        showMessage("تم تسجيل الدخول بنجاح.","success");
        setTimeout(()=>window.location.href="../index.html",1000);
      }catch(err){
        showMessage(err.message||"فشل تسجيل الدخول.","error");
      }finally{
        loginButton.disabled=false;
        loginButton.textContent="تسجيل الدخول";
      }
    });

    function showMessage(text,type){
      formMessage.textContent=text;
      formMessage.className="message "+type;
    }
  </script>
</body>
</html>
