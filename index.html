<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شجرة عفرين</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            text-align:center;
        }

        header{
            background:#1b5e20;
            color:white;
            padding:25px;
        }

        h1{
            margin:0;
            font-size:34px;
        }

        p{
            color:#555;
        }

        .card{
            background:white;
            width:90%;
            max-width:700px;
            margin:30px auto;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        button{
            background:#1b5e20;
            color:white;
            border:none;
            padding:15px 25px;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#2e7d32;
        }
    </style>
</head>

<body>

<header>
    <h1>🌳 شجرة عفرين</h1>
    <p>Family Tree & Historical Archive</p>
</header>

<div class="card">

<h2>مرحباً بك</h2>

<p>
هذا هو أول إصدار من مشروع
<strong>شجرة عفرين</strong>.
</p>

<button>
ابدأ الاستكشاف
</button>

</div>

</body>
</html>
